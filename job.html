<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job · Get Butter</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="logo" href="index.html" aria-label="Get Butter home">butter<span class="dot">.</span></a>
    <a class="back" href="jobs.html">← ALL JOBS</a>
  </div>
</header>
<main class="wrap">
  <div class="detail">
    <section class="main" data-job-detail></section>
    <aside data-apply>
      <form class="card card-yellow on-yellow" data-lead="application" aria-labelledby="apply-h">
        <span class="mono eyebrow">Apply in 2 minutes</span>
        <h2 id="apply-h">I want this<span class="dot">.</span></h2>
        <input type="hidden" id="job-id" name="job">
        <div class="field"><label for="a-name">Full name</label><input id="a-name" name="name" autocomplete="name" required></div>
        <div class="field"><label for="a-email">Email</label><input id="a-email" name="email" type="email" autocomplete="email" required></div>
        <div class="field"><label for="a-phone">Phone</label><input id="a-phone" name="phone" type="tel" autocomplete="tel" required></div>
        <div class="field">
          <span class="label">CV (PDF or Word, max 5MB)</span>
          <label class="file-drop" for="a-cv">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg>
            <span data-file-label>Upload your CV</span>
            <input id="a-cv" name="cv" type="file" accept=".pdf,.doc,.docx" required>
          </label>
        </div>
        <div class="field"><label for="a-note">Anything else? (optional)</label><textarea id="a-note" name="note" rows="3"></textarea></div>
        <label class="check">
          <input type="checkbox" name="consent" value="yes" required>
          <span>I'm happy for Get Butter to share my CV with this venue. See our <a href="privacy.html">privacy policy</a>.</span>
        </label>
        <button class="btn btn-black" type="submit" style="width:100%">Send application</button>
      </form>
    </aside>
  </div>
</main>
<footer class="site-footer">
  <div class="wrap">
    <span class="mono">© <span data-year></span> Get Butter · Sample role for preview only</span>
    <nav class="mono" aria-label="Footer"><a href="index.html">Home</a><a href="https://www.instagram.com/butter_recruitment/" target="_blank" rel="noopener">Instagram</a><a href="privacy.html">Privacy</a></nav>
  </div>
</footer>
<script src="assets/jobs-data.js"></script>
<script src="assets/leads.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
